name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Flet y dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade flet flet-audio flet-permission-handler flet-notifications yt-dlp

      - name: Compilar APK
        timeout-minutes: 45
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: flet build apk --arch arm64-v8a --yes

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: build/apk/*.apk
