name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Pre-aceptar licencias de Android SDK
        run: |
          for SDK_DIR in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
            if [ -d "$SDK_DIR" ]; then
              SDKMGR=$(find "$SDK_DIR" -name "sdkmanager" 2>/dev/null | head -n 1)
              if [ -n "$SDKMGR" ]; then
                yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
              fi
            fi
          done

      - name: Configurar repositorios de Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/repos.gradle.kts
          beforeSettings {
              pluginManagement {
                  repositories {
                      gradlePluginPortal()
                      mavenCentral()
                      google()
                  }
              }
          }
          EOF

      - name: Instalar Flet y dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade flet flet-audio flet-video flet-permission-handler flet-notifications yt-dlp mutagen certifi

      - name: Compilar APK
        timeout-minutes: 45
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: flet build apk --arch arm64-v8a --yes -vv

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: build/apk/*.apk
